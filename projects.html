<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #151a2e;
      --surface: #1f2645;
      --surface-hover: #283058;
      --edge: #0b0e1c;
      --text: #eef0f8;
      --muted: #9aa3c7;
      --accent: #801ae1;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 580px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    h1 {
      font-family: "Pixelify Sans", "Courier New", monospace;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      line-height: 1.1;
      margin: 0 0 12px;
      letter-spacing: 0.01em;
    }

    .intro {
      margin: 0 0 40px;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 44ch;
    }

    .projects {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 20px;
    }

    .project {
      display: block;
      padding: 18px 22px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--edge);
      border-radius: 6px;
      box-shadow: 5px 5px 0 var(--accent);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .project:hover {
      background: var(--surface-hover);
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 var(--accent);
    }

    .project:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 var(--accent);
    }

    .project:focus-visible,
    .back:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 4px;
    }

    .project-name {
      display: block;
      font-family: "Pixelify Sans", "Courier New", monospace;
      font-weight: 500;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .project-desc {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .back {
      display: inline-block;
      margin-top: 48px;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--muted);
    }

    .back:hover { color: var(--text); border-color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      .project { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Things I've built</h1>
    <p class="intro">all my projects</p>

    <ul class="projects">
      <!-- To add a project: copy one <li> block, change the href, name, and description. -->
      <li>
        <a class="project" href="https://lemonthegoat11.github.io/blockline/">
          <span class="project-name">Blockline</span>
          <span class="project-desc">2d minecraft-like game in the browser</span>
        </a>
      </li>
      <li>
        <a class="project" href="https://github.com/yourusername/project-two">
          <span class="project-name">Placeholder</span>
          <span class="project-desc">A short line about what it does.</span>
        </a>
      </li>
      <li>
        <a class="project" href="https://github.com/yourusername/project-three">
          <span class="project-name">Placeholder</span>
          <span class="project-desc">A short line about what it does.</span>
        </a>
      </li>
    </ul>

    <a class="back" href="index.html">Back to bio</a>
  </main>
</body>
</html>
